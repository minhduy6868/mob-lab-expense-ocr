<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="VKU Ledger: sổ chi tiêu hóa đơn cho sinh viên VKU, đồng bộ Cloudflare D1.">
  <meta name="theme-color" content="#102343">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VKU Ledger">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <title>VKU Ledger</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #102343;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      background: #102343;
      color: #F4F0E6;
    }
    .brand-mark {
      width: 96px;
      height: 96px;
      border-radius: 22px;
    }
    .brand-kicker {
      margin-top: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.6px;
      color: #E8A317;
    }
    .brand-title {
      margin-top: 8px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: #F4F0E6;
    }
    .brand-sub {
      margin-top: 6px;
      font-size: 14px;
      color: rgba(244, 240, 230, 0.78);
    }
    @media (prefers-reduced-motion: reduce) {
      .brand-mark { transition: none; }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <img class="brand-mark" src="splash_mark.png" alt="" width="96" height="96">
    <div class="brand-kicker">VKU ĐÀ NẴNG</div>
    <div class="brand-title">VKU Ledger</div>
    <div class="brand-sub">Sổ chi tiêu hóa đơn</div>
  </div>

  <script>
    // Bypass outdated service worker cache on reload
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=2.0.0" async></script>
</body>
</html>
